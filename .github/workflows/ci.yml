name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  datasets-json:
    name: Validate datasets JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/validate-datasets-json.sh

  version-json:
    name: Validate version.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/validate-version-json.sh

  dataset-version-bump:
    name: Check dataset version bumps
    runs-on: ubuntu-latest
    needs: [datasets-json, version-json]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check-dataset-versions.sh
